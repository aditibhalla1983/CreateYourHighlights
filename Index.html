<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeReal - Create Your Own Highlights</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --text-main: #ffffff;
      --text-muted: #7e7e7e;
      --accent-white: #ffffff;
      --accent-black: #000000;
      --outline-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
    }

    /* Device Wrapper for Smartphone Simulation */
    .phone-wrapper {
      width: 390px;
      height: 844px;
      background-color: var(--bg-color);
      border: 12px solid #333;
      border-radius: 40px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    /* Status Bar Simulation */
    .status-bar {
      height: 44px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
      background-color: var(--bg-color);
    }
    .status-bar .right-icons {
      display: flex;
      gap: 6px;
    }

    /* Main Viewport Container */
    .screen-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
      z-index: 1;
    }
    .screen.active {
      z-index: 2;
    }

    /* Scrollable Area */
    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 120px 16px;
    }

    /* Header Styling */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: var(--bg-color);
    }
    .brand-logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .avatar-btn {
      width: 32px;
      height: 32px;
      background-color: #222;
      border-radius: 50%;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 16px 0 12px 0;
    }

    /* Discovery UI Components */
    .creation-entry-zone {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .btn-create-highlights {
      flex: 1;
      background-color: var(--accent-white);
      color: var(--accent-black);
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .btn-info-trigger {
      width: 44px;
      height: 44px;
      background-color: var(--card-bg);
      border: 1px solid var(--outline-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
    }
    .btn-info-trigger svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Recap Cards horizontal block */
    .recap-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
    }
    .recap-container::-webkit-scrollbar {
      display: none;
    }
    .recap-card {
      min-width: 165px;
      width: 165px;
      height: 220px;
      border-radius: 12px;
      position: relative;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }
    .recap-badge {
      background-color: rgba(0,0,0,0.6);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      align-self: flex-start;
      text-transform: uppercase;
    }
    .recap-card-bottom {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .recap-title {
      font-size: 16px;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .recap-meta {
      font-size: 11px;
      color: #ccc;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .btn-play-recap {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: rgba(255,255,255,0.9);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-play-recap svg {
      width: 16px;
      height: 16px;
      fill: #000;
      margin-left: 2px;
    }

    /* Explanation Popover overlay styling */
    .popover-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.75);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .popover-card {
      background-color: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      position: relative;
    }
    .popover-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
    }
    .popover-heading {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
      padding-right: 24px;
    }
    .popover-desc {
      font-size: 14px;
      color: #e5e5ea;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .popover-privacy {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Selection Screen Layout */
    .selection-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-color);
    }
    .btn-back {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      font-size: 16px;
    }
    .counter-badge {
      background-color: #1c1c1e;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .selection-title-area {
      padding: 0 16px;
      margin-bottom: 16px;
    }
    .selection-main-heading {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .selection-subheading {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* Custom Dropdown Date Selector */
    .date-selector-container {
      padding: 0 16px;
      margin-bottom: 16px;
      position: relative;
    }
    .dropdown-trigger {
      background-color: transparent;
      border: none;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 4px 0;
    }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 16px;
      background-color: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 8px;
      z-index: 50;
      display: none;
      flex-direction: column;
      width: 180px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }
    .dropdown-item {
      padding: 12px 16px;
      text-align: left;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }
    .dropdown-item:hover {
      background-color: #2c2c2e;
    }

    /* Thumbnail Memory Grid Architecture */
    .thumbnail-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .thumbnail-cell {
      position: relative;
      aspect-ratio: 3 / 4;
      background-color: #121212;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }
    .thumbnail-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.2s ease;
    }
    .thumbnail-date-label {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 10px;
      font-weight: 700;
      background-color: rgba(0,0,0,0.6);
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .selection-indicator {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.8);
      background-color: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .selection-indicator svg {
      width: 12px;
      height: 12px;
      fill: var(--accent-black);
      display: none;
    }

    /* Selected State Modifier classes */
    .thumbnail-cell.selected {
      border: 2px solid var(--accent-white);
    }
    .thumbnail-cell.selected .selection-indicator {
      background-color: var(--accent-white);
      border-color: var(--accent-white);
