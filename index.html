<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeReal Prototype</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --text-main: #ffffff;
      --text-muted: #7e7e7e;
      --accent-white: #ffffff;
      --accent-black: #000000;
      --outline-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
      padding: 20px;
    }

    /* Device Wrapper centered on screen */
    .phone-wrapper {
      width: 390px;
      height: 844px;
      background-color: var(--bg-color);
      border: 12px solid #333333;
      border-radius: 40px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .status-bar {
      height: 44px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      background-color: var(--bg-color);
      z-index: 10;
    }

    .screen-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      background-color: var(--bg-color);
    }

    .screen.active {
      display: flex;
    }

    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 120px 16px;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
    }

    .brand-logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .avatar-btn {
      width: 32px;
      height: 32px;
      background-color: #222;
      border-radius: 50%;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      border: none;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 16px 0 12px 0;
    }

    .creation-entry-zone {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .btn-create-highlights {
      flex: 1;
      background-color: var(--accent-white);
      color: var(--accent-black);
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-info-trigger {
      width: 44px;
      height: 44px;
      background-color: var(--card-bg);
      border: 1px solid var(--outline-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
    }

    .recap-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      margin-bottom: 24px;
      padding-bottom: 4px;
    }

    .recap-card {
      min-width: 165px;
      height: 220px;
      border-radius: 12px;
      background-color: #1c1c1e;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      border: 1px solid var(--outline-color);
    }

    .recap-badge {
      background-color: rgba(255,255,255,0.1);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      align-self: flex-start;
    }

    .recap-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .recap-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Thumbnail Memory Grid Layout */
    .thumbnail-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .thumbnail-cell {
      position: relative;
      aspect-ratio: 3 / 4;
      background-color: #2c2c2e;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumbnail-placeholder-content {
      font-size: 24px;
    }

    .thumbnail-date-label {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 10px;
      font-weight: 700;
      background-color: rgba(0,0,0,0.7);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .selection-indicator {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.6);
      background-color: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumbnail-cell.selected {
      border-color: var(--accent-white);
    }

    .thumbnail-cell.selected .selection-indicator {
      background-color: var(--accent-white);
      border-color: var(--accent-white);
    }

    .thumbnail-cell.selected .selection-indicator::after {
      content: "✓";
      color: var(--accent-black);
      font-size: 11px;
      font-weight: 900;
    }

    /* Dropdown UI Selector */
    .dropdown-trigger {
      background-color: transparent;
      border: none;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .dropdown-menu {
      position: absolute;
      background-color: #1c1c1e;
      border: 1px solid var(--outline-color);
      border-radius: 8px;
      display: none;
      flex-direction: column;
      width: 180px;
      z-index: 50;
    }

    .dropdown-item {
      padding: 12px 16px;
      text-align: left;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }

    /* Popover Explanations Overlay */
    .popover-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .popover-card {
      background-color: #1c1c1e;
      border: 1px solid var(--outline-color);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
    }

    .popover-heading {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .popover-desc {
      font-size: 14px;
      color: #d1d1d6;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .popover-close {
      float: right;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }

    .sticky-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #000000;
      padding: 16px;
      border-top: 1px solid var(--outline-color);
    }

    .footer-helper-text {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 12px;
    }

    .footer-helper-text.error-alert {
      color: #ff453a;
    }

    .btn-continue {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      background-color: #262629;
      color: #545456;
      cursor: not-allowed;
    }

    .btn-continue:enabled {
      background-color: var(--accent-white);
      color: var(--accent-black);
      cursor: pointer;
    }

    .state-view {
      display: none;
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
    }

    /* Sandbox Panel Utility Configuration */
    .sandbox-panel {
      position: absolute;
      left: calc(50% + 210px);
      width: 200px;
      background-color: #222;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (max-width: 850px) {
      body { flex-direction: column; height: auto; }
      .sandbox-panel { position: static; width: 390px; margin-top: 20px; }
    }

    .sandbox-btn {
      background-color: #333;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Smart Phone Layout Wrapper Frame -->
  <div class="phone-wrapper">
    <div class="status-bar">
      <div>9:41</div>
      <div>🔋</div>
    </div>

    <div class="screen-container">
      
      <!-- SCREEN 1: DISCOVER OVERVIEW -->
      <div id="screen-discover" class="screen active">
        <div class="scroll-content">
          <div class="app-header">
            <h1 class="brand-logo">BeReal.</h1>
            <button class="avatar-btn">AB</button>
          </div>
          
          <h2 class="section-title">Your Memories</h2>
          
          <div class="creation-entry-zone">
            <button id="entry-create-btn" class="btn-create-highlights">＋ Create highlights</button>
            <button id="entry-info-btn" class="btn-info-trigger" aria-label="About Create Your Own Highlights">ℹ️</button>
          </div>

          <div class="recap-container">
            <div class="recap-card">
              <span class="recap-badge">This month</span>
              <div>
