<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeReal - Memories Prototype</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --text-main: #ffffff;
      --text-muted: #7e7e7e;
      --outline-color: #2c2c2e;
      --pill-bg: #121212;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
    }

    /* Device Wrapper for Smartphone Simulation */
    .phone-wrapper {
      width: 390px;
      height: 844px;
      background-color: var(--bg-color);
      border: 12px solid #333;
      border-radius: 45px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 30px;
      background-color: #000;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      z-index: 100;
    }

    .status-bar {
      height: 44px;
      padding: 0 32px 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
      background-color: var(--bg-color);
    }

    .status-bar .right-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .screen-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      background-color: var(--bg-color);
    }

    .screen.active {
      display: flex;
    }

    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 140px 16px;
    }

    .scroll-content::-webkit-scrollbar {
      display: none;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      margin-bottom: 8px;
    }

    .brand-logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .avatar-btn {
      width: 32px;
      height: 32px;
      background-color: #262629;
      border-radius: 50%;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 16px 0 12px 0;
    }

    .creation-entry-zone {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0 20px 0;
    }

    .btn-create-highlights {
      flex: 1;
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 15px 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }

    .btn-info-trigger {
      width: 50px;
      height: 50px;
      background-color: #121212;
      border: 1px solid #1c1c1e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
    }

    .recap-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 4px;
    }

    .recap-container::-webkit-scrollbar {
      display: none;
    }

    .recap-card {
      min-width: 165px;
      width: 165px;
      height: 228px;
      border-radius: 14px;
      position: relative;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      overflow: hidden;
      box-shadow: inset 0 -60px 40px rgba(0,0,0,0.8);
      border: 1px solid #1c1c1e;
    }

    .recap-badge {
      background-color: rgba(0,0,0,0.6);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 800;
      align-self: flex-start;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .recap-card-bottom {
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 2;
    }

    .recap-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }

    .recap-meta {
      font-size: 10px;
      color: var(--text-muted);
    }

    .btn-play-recap {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: rgba(255,255,255,0.9);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
    }

    .btn-play-recap svg {
      width: 14px;
      height: 14px;
      fill: #000;
      margin-left: 2px;
    }

    .context-caption {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin: 12px 0 24px 0;
    }

    .past-memories-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .past-date-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .popover-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .popover-card {
      background-color: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 310px;
      position: relative;
    }

    .popover-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
    }

    .popover-heading {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .popover-desc {
      font-size: 14px;
      color: #e5e5ea;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .selection-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-color);
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      font-size: 16px;
    }

    .counter-badge {
      background-color: #1c1c1e;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .dropdown-trigger {
      background-color: transparent;
      border: none;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      margin: 4px 0 16px 0;
    }

    .dropdown-menu {
      position: absolute;
      background-color: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 8px;
      display: none;
      flex-direction: column;
      width: 180px;
      z-index: 50;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }

    .dropdown-item {
      padding: 12px 16px;
      text-align: left;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }

    .dropdown-item:hover {
      background-color: #2c2c2e;
    }

    .thumbnail-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .thumbnail-cell {
      position: relative;
      aspect-ratio: 3 / 4;
      background-color: #1c1c1e;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .thumbnail-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumbnail-date-overlay {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .selection-indicator {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.7);
      background-color: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumbnail-cell.selected {
      border-color: var(--text-main);
    }

    .thumbnail-cell.selected .selection-indicator {
      background-color: var(--text-main);
      border-color: var(--text-main);
    }

    .thumbnail-cell.selected .selection-indicator::after {
      content: "✓";
      color: #000000;
      font-size: 11px;
      font-weight: 900;
    }

    .state-view {
      display: none;
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .sticky-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(to top, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
      padding: 24px 16px;
      z-index: 30;
    }

    .footer-helper-text {
